<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>Minecraft Addons Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a url('https://images.wallpapersden.com/image/download/wither-storm-minecraft-story-mode_bGdsbWaUmZqaraWkpJRmbmdlrWZlbWU.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      z-index: -1;
    }
    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: linear-gradient(180deg, rgba(20,20,20,0.95) 0%, rgba(10,10,10,0.7) 100%);
      padding: 22px 16px 14px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .header h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 12px;
      color: #4CAF50;
      letter-spacing: 2px;
      margin-bottom: 4px;
      text-shadow: 0 0 12px #4CAF50;
    }
    .header h2 {
      font-family: 'Press Start 2P', cursive;
      font-size: 16px;
      color: #4CAF50;
      margin-bottom: 14px;
      text-shadow: 0 0 14px #4CAF50;
    }
    .search-box input {
      width: 100%;
      padding: 12px 15px;
      border: 1.5px solid #333;
      border-radius: 12px;
      background: rgba(20,20,20,0.9);
      color: white;
      font-size: 15px;
      outline: none;
    }
    .search-box input::placeholder { color: #777; }
    .addons-list {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .addon-card {
      background: rgba(18,18,18,0.92);
      border-radius: 16px;
      padding: 14px;
      border: 1.5px solid #2a2a2a;
      display: flex;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .addon-img {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      background: #222;
      flex-shrink: 0;
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .addon-info { flex: 1; min-width: 0; }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
      gap: 6px;
    }
    .card-header h3 {
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      line-height: 1.35;
      color: #4CAF50;
    }
    .category {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      background: rgba(76, 175, 80, 0.18);
      color: #4CAF50;
      white-space: nowrap;
    }
    .version { color: #888; font-size: 11px; margin-bottom: 6px; }
    .description { color: #bbb; font-size: 12.5px; line-height: 1.4; margin-bottom: 10px; }
    .download-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #000;
      background: #4CAF50;
      cursor: pointer;
    }
    .footer { text-align: center; padding: 16px; color: #666; font-size: 12px; }
    .empty { text-align: center; color: #666; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>MINECRAFT</h1>
      <h2>ADDONS HUB</h2>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar addon..." autocomplete="off">
      </div>
    </header>
    <main class="addons-list" id="addonsList"></main>
    <footer class="footer">
      <p>Minecraft Addons Hub • Hecho con 💚</p>
    </footer>
  </div>

  <script>
    const addons = [
      { name: "WITHER STORM", tags: ["wither","storm","boss","story mode","witherstorm"], category: "BOSS", version: "1.21+", description: "El temible Wither Storm de Minecraft Story Mode. Un jefe gigante que crece y destroza el mundo.", downloadUrl: "https://www.curseforge.com/minecraft-bedrock/addons/witheredworld" },
      { name: "EFFORTLESS BUILDING", tags: ["ef","effortless","building","construir","bloques"], category: "BUILDING", version: "3.1", description: "Construye paredes, pisos, esferas y cilindros en segundos. El mejor addon de construcción.", downloadUrl: "https://www.curseforge.com/minecraft-bedrock/addons/effortless-building" },
      { name: "COBBLEDROCK", tags: ["cb","cobble","cobbledrock","pokemon","poke"], category: "POKEMON", version: "1.3.1", description: "Addon completo de Pokémon. Captura, entrena y batalla con cientos de Pokémon.", downloadUrl: "https://mcpedl.com/cobbledrock/" },
      { name: "GOPRO PERSPECTIVE", tags: ["gopro","go pro","camera","camara"], category: "CAMERA", version: "1.21+", description: "Nuevas perspectivas de cámara estilo GoPro para cinemáticas épicas.", downloadUrl: "https://www.mediafire.com/file/lst1kv92l9e3e9c/GoPro_Perspective_1.21%252B.mcaddon/file" },
      { name: "PORTAL GUN", tags: ["portal","gun","rick","morty"], category: "ADVENTURE", version: "1.1.1", description: "Portal Gun de Rick & Morty. Crea portales y viaja entre dimensiones.", downloadUrl: "https://mcpedl.com/portal-gun-addon-tek/" },
      { name: "TRANSPARENT TOUCH BUTTONS", tags: ["transparent","touch","buttons","botones"], category: "UI", version: "1.21+", description: "Botones táctiles transparentes para una interfaz más limpia.", downloadUrl: "https://modsfire.com/aaQV3Y4SqgjuL11" },
      { name: "ADVANCED NICHIRIN", tags: ["nichirin","demon","slayer","espada"], category: "WEAPONS", version: "1.21+", description: "Espada Nichirin avanzada estilo Demon Slayer.", downloadUrl: "https://modsfire.com/bap4v047tYly195" },
      { name: "WHITE OUTLINE", tags: ["white","outline","contorno"], category: "UI", version: "1.21+", description: "Contorno blanco al seleccionar bloques.", downloadUrl: "https://www.mediafire.com/file/ucm67z3yokaowb9/White_Outline_Selection_ByLordKennMC.mcpack/file" },
      { name: "FPS COUNTER", tags: ["fps","counter","contador"], category: "UTILITY", version: "1.21+", description: "Contador de FPS dentro del juego.", downloadUrl: "https://modsfire.com/pB4b1ezCn3CN9ym" },
      { name: "TRUE WEAPONS", tags: ["true","weapons","armas"], category: "WEAPONS", version: "1.21+", description: "Pack de armas con modelos y efectos épicos.", downloadUrl: "https://modsfire.com/8mEQGZpzLN90VrH" },
      { name: "ESSENTIALS", tags: ["essentials","esencial","herramientas"], category: "UTILITY", version: "1.21+", description: "Herramientas esenciales: yunque reparable, teleports y más.", downloadUrl: "https://www.curseforge.com/minecraft-bedrock/addons/essentials" },
      { name: "ACTIONS & STUFF", tags: ["actions","stuff","animaciones"], category: "ANIMATION", version: "1.21+", description: "Animaciones realistas para jugadores y mobs.", downloadUrl: "https://www.curseforge.com/minecraft-bedrock/addons/actions-stuff" }
    ];

    const list = document.getElementById("addonsList");
    const searchInput = document.getElementById("searchInput");

    function renderAddons(filter = "") {
      list.innerHTML = "";
      const q = filter.toLowerCase().trim();
      const filtered = addons.filter(a => {
        if (!q) return true;
        if (a.name.toLowerCase().includes(q)) return true;
        if (a.description.toLowerCase().includes(q)) return true;
        if (a.category.toLowerCase().includes(q)) return true;
        if (a.tags && a.tags.some(tag => tag.includes(q) || q.includes(tag))) return true;
        return false;
      });
      if (filtered.length === 0) {
        list.innerHTML = `<p class="empty">No se encontraron addons</p>`;
        return;
      }
      filtered.forEach(addon => {
        const card = document.createElement("div");
        card.className = "addon-card";
        card.innerHTML = `
          <div class="addon-img">
            ${addon.category === 'BOSS' ? '💀' : addon.category === 'BUILDING' ? '🏗️' : addon.category === 'POKEMON' ? '⚡' : addon.category === 'CAMERA' ? '📷' : addon.category === 'WEAPONS' ? '⚔️' : addon.category === 'UI' ? '🎛️' : '📦'}
          </div>
          <div class="addon-info">
            <div class="card-header">
              <h3>${addon.name}</h3>
              <span class="category">${addon.category}</span>
            </div>
            <div class="version">Versión: ${addon.version}</div>
            <p class="description">${addon.description}</p>
            <button class="download-btn" onclick="window.open('${addon.downloadUrl}', '_blank')">DESCARGAR</button>
          </div>
        `;
        list.appendChild(card);
      });
    }
    searchInput.addEventListener("input", e => renderAddons(e.target.value));
    renderAddons();
  </script>
</body>
</html>
